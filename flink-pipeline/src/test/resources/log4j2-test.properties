# Test logging. The mini cluster is chatty enough to bury an assertion failure, so only warnings
# and above are shown by default while the pipeline's own classes stay at INFO.
rootLogger.level = WARN
rootLogger.appenderRef.console.ref = ConsoleAppender

appender.console.name = ConsoleAppender
appender.console.type = CONSOLE
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %d{HH:mm:ss,SSS} %-5p %-50c - %m%n

logger.pipeline.name = com.stream.processing
logger.pipeline.level = INFO

logger.flink.name = org.apache.flink
logger.flink.level = WARN

# The mini cluster warns on every start that it has no log file path and no delegation tokens,
# neither of which means anything in a test JVM.
logger.flinkWebMonitor.name = org.apache.flink.runtime.webmonitor
logger.flinkWebMonitor.level = ERROR

logger.flinkTokens.name = org.apache.flink.runtime.security.token
logger.flinkTokens.level = ERROR

logger.flinkMetricNames.name = org.apache.flink.metrics.MetricGroup
logger.flinkMetricNames.level = ERROR

logger.kafka.name = org.apache.kafka
logger.kafka.level = WARN
