# Job-jar logging configuration. The Flink distribution ships its own log4j2 setup for the
# cluster daemons; this file governs the classes loaded from the job jar.
rootLogger.level = INFO
rootLogger.appenderRef.console.ref = ConsoleAppender

appender.console.name = ConsoleAppender
appender.console.type = CONSOLE
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %d{yyyy-MM-dd HH:mm:ss,SSS} %-5p %-60c %x - %m%n

# The job's own classes: INFO is where the per-alert lines live, which is the signal wanted
# while demonstrating the pipeline.
logger.pipeline.name = com.vassar.aware
logger.pipeline.level = INFO

# The Kafka clients log a full producer/consumer configuration dump at INFO on every open, which
# buries everything else on a task manager running several subtasks.
logger.kafka.name = org.apache.kafka
logger.kafka.level = WARN
