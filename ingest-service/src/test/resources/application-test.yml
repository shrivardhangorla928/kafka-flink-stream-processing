# Test profile: the schedule is off by default so a test never races a background scrape round,
# and the storm tuning is pinned so an assertion about alert bands cannot be broken by retuning
# the production defaults.
spring:
  kafka:
    bootstrap-servers: ${spring.embedded.kafka.brokers:localhost:9092}

stream:
  kafka:
    partitions: 3
    replication-factor: 1
  ingest:
    scrape-interval-ms: 3600000
    source: STREAM_SIMULATOR
    max-batch-size: 100
    simulator:
      enabled: false
      seed: 42
      storm-fraction: 0.12
      storm-min-cycles: 5
      storm-max-cycles: 10

logging:
  level:
    root: WARN
    com.stream.processing: INFO
    org.apache.kafka: ERROR
    kafka: ERROR
    org.apache.zookeeper: ERROR
    state.change.logger: ERROR
