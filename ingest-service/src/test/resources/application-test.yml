# Test profile: the real scraper is off so a Spring context boot never fires a live call
# against the actual desweather.ap.gov.in API.
spring:
  kafka:
    bootstrap-servers: ${spring.embedded.kafka.brokers:localhost:9092}

stream:
  kafka:
    partitions: 3
    replication-factor: 1
  ingest:
    desweather-scrape-enabled: false
    max-batch-size: 100

logging:
  level:
    root: WARN
    com.stream.processing: INFO
    org.apache.kafka: ERROR
    kafka: ERROR
    org.apache.zookeeper: ERROR
    state.change.logger: ERROR
