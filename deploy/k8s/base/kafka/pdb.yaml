apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: kafka
  labels:
    app.kubernetes.io/name: kafka
    app.kubernetes.io/component: broker
spec:
  # min.insync.replicas is 2, so losing a second broker while one is already down
  # stops acks=all producers. Two available is therefore the point below which a
  # voluntary disruption stops being voluntary.
  minAvailable: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: kafka
      app.kubernetes.io/component: broker
