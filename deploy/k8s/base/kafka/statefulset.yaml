apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
  labels:
    app.kubernetes.io/name: kafka
    app.kubernetes.io/component: broker
    app.kubernetes.io/version: "3.9.1"
spec:
  serviceName: kafka-headless
  replicas: 3
  # OrderedReady would deadlock a KRaft cluster on a cold start: kafka-0 cannot
  # reach a controller quorum, and therefore cannot become Ready, until a majority
  # of the voters exist - but OrderedReady will not create kafka-1 until kafka-0 is
  # Ready. Parallel breaks that cycle. Rolling updates still go one pod at a time
  # because the PodDisruptionBudget and updateStrategy govern that separately.
  podManagementPolicy: Parallel
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: kafka
      app.kubernetes.io/component: broker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kafka
        app.kubernetes.io/component: broker
        app.kubernetes.io/version: "3.9.1"
    spec:
      serviceAccountName: kafka
      automountServiceAccountToken: false
      # A controlled shutdown migrates partition leadership before the process
      # exits; cutting that short forces the remaining brokers into an election.
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        # The image's own `appuser`. Pinning it here means the container never runs
        # as root at all, which is what lets the namespace enforce `restricted`.
        runAsUser: 1000
        runAsGroup: 1000
        # fsGroup is what makes the freshly provisioned PVC writable by appuser;
        # without it `kafka-storage format` fails on an empty volume.
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      affinity:
        podAntiAffinity:
          # Preferred, not required: a single-node minikube must still be able to
          # schedule all three brokers. On a multi-node cluster the scheduler
          # spreads them, which is the only thing that makes replication factor 3
          # worth anything.
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: kafka
                    app.kubernetes.io/component: broker
      containers:
        - name: kafka
          image: apache/kafka:3.9.1
          imagePullPolicy: IfNotPresent
          # Entrypoint wrapper.
          #
          # Two settings cannot be a single static value across the StatefulSet:
          #   node.id                - must be unique per broker
          #   advertised.listeners   - must be this pod's own DNS name, because a
          #                            client that bootstraps via `kafka:9092` is
          #                            told where to find each partition leader,
          #                            and a shared value would send every client
          #                            back to a random broker.
          # Both are derived here from the pod's ordinal, which for a StatefulSet
          # is the suffix of the hostname. The KRaft voter list is built from the
          # same naming scheme so it can never drift from the advertised names.
          # `exec` at the end hands off to the image's real entrypoint, so the
          # broker keeps PID 1 and still receives SIGTERM.
          command:
            - /bin/bash
            - -c
            - |
              set -euo pipefail

              ORDINAL="${HOSTNAME##*-}"
              declare -i NODE_ID=ORDINAL+1
              export KAFKA_NODE_ID="${NODE_ID}"

              DOMAIN="${KAFKA_HEADLESS_SERVICE}.${POD_NAMESPACE}.svc.cluster.local"
              export KAFKA_ADVERTISED_LISTENERS="PLAINTEXT://${HOSTNAME}.${DOMAIN}:9092"

              VOTERS=""
              declare -i index=0
              while (( index < KAFKA_CLUSTER_SIZE )); do
                declare -i voter_id=index+1
                if [ -n "${VOTERS}" ]; then
                  VOTERS="${VOTERS},"
                fi
                VOTERS="${VOTERS}${voter_id}@kafka-${index}.${DOMAIN}:9093"
                index+=1
              done
              export KAFKA_CONTROLLER_QUORUM_VOTERS="${VOTERS}"

              echo "derived node.id                  = ${KAFKA_NODE_ID}"
              echo "derived advertised.listeners     = ${KAFKA_ADVERTISED_LISTENERS}"
              echo "derived controller.quorum.voters = ${KAFKA_CONTROLLER_QUORUM_VOTERS}"

              exec /etc/kafka/docker/run
          ports:
            - name: kafka
              containerPort: 9092
              protocol: TCP
            - name: controller
              containerPort: 9093
              protocol: TCP
          envFrom:
            - configMapRef:
                name: kafka-config
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          resources:
            requests:
              memory: 1Gi
              cpu: 500m
            limits:
              memory: 2Gi
              cpu: "2"
          # A TCP probe rather than `kafka-topics.sh --list`: the shell form starts
          # a fresh JVM on every probe interval, which on a workstation costs more
          # than the broker it is watching. The listener only binds once the broker
          # has joined the quorum and finished log recovery, so a successful
          # connect is a meaningful readiness signal.
          startupProbe:
            tcpSocket:
              port: kafka
            periodSeconds: 5
            # 30 x 5s = 150s. Log recovery on a large volume plus quorum election
            # is the slow case; a cold empty volume is up in about 15s.
            failureThreshold: 30
          readinessProbe:
            tcpSocket:
              port: kafka
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: kafka
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 5
          securityContext:
            allowPrivilegeEscalation: false
            # The broker writes to exactly three places, all mounted below.
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: data
              mountPath: /var/lib/kafka/data
            # The image's entrypoint renders the final server.properties into this
            # directory from the KAFKA_* environment, so it has to be writable.
            - name: config
              mountPath: /opt/kafka/config
            - name: logs
              mountPath: /opt/kafka/logs
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          emptyDir: {}
        - name: logs
          emptyDir: {}
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/name: kafka
          app.kubernetes.io/component: broker
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 5Gi
