apiVersion: v1
kind: ServiceAccount
metadata:
  name: kafka
  labels:
    app.kubernetes.io/name: kafka
    app.kubernetes.io/component: broker
# KRaft discovers its peers through DNS, not through the Kubernetes API.
automountServiceAccountToken: false

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kafka-topic-init
  labels:
    app.kubernetes.io/name: kafka
    app.kubernetes.io/component: topic-init
automountServiceAccountToken: false
