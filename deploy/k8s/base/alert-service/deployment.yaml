apiVersion: apps/v1
kind: Deployment
metadata:
  name: alert-service
  labels:
    app.kubernetes.io/name: alert-service
    app.kubernetes.io/component: api
    app.kubernetes.io/version: 1.0.0
spec:
  # Three replicas because alerts.generated.v1 has three partitions and all three
  # replicas share one consumer group: one consumer per partition is the maximum
  # useful parallelism. A fourth replica would join the group, be assigned no
  # partition and idle - it would add API capacity but no consumption capacity,
  # which is why the HPA in phase 3 has to be reasoned about against the partition
  # count and not just against CPU.
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: alert-service
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: alert-service
        app.kubernetes.io/component: api
        app.kubernetes.io/version: 1.0.0
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: /actuator/prometheus
    spec:
      serviceAccountName: alert-service
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        # uid 1001 is the `stream` account created in the Dockerfile's alert stage.
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: alert-service
              app.kubernetes.io/component: api
      initContainers:
        # Flyway runs inside the application at boot and fails the context if the
        # database is not there. Waiting here means a slow Postgres start costs one
        # init container retry instead of a CrashLoopBackOff on the application,
        # and it makes the dependency visible in `kubectl describe` rather than
        # buried in a stack trace.
        #
        # postgres:16-alpine is reused as the probe image because it is already
        # required by this namespace and ships pg_isready; it is a lighter answer
        # than pulling a separate wait-for-it image.
        - name: wait-for-postgres
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              echo "waiting for postgres:5432 ..."
              # The attempt counter is the length of a string rather than shell
              # arithmetic: kubelet expands $(...) in a container command before
              # the shell ever sees it, so arithmetic expansion is best avoided
              # in an inline script.
              attempts=""
              until pg_isready -h postgres -p 5432 -U "$POSTGRES_USER" -d "$POSTGRES_DB" >/dev/null 2>&1; do
                attempts="${attempts}."
                if [ "${#attempts}" -gt 90 ]; then
                  echo "postgres was still not accepting connections after 3 minutes" >&2
                  exit 1
                fi
                sleep 2
              done
              echo "postgres is accepting connections"
          envFrom:
            - secretRef:
                name: stream-postgres
          resources:
            requests:
              memory: 32Mi
              cpu: 25m
            limits:
              memory: 64Mi
              cpu: 100m
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
        - name: wait-for-kafka
          image: stream/alert-service:1.0.0
          imagePullPolicy: IfNotPresent
          command:
            - /bin/bash
            - -c
            - |
              set -euo pipefail
              echo "waiting for ${KAFKA_HOST}:${KAFKA_PORT} ..."
              declare -i attempt=0
              until (echo > /dev/tcp/${KAFKA_HOST}/${KAFKA_PORT}) 2>/dev/null; do
                attempt+=1
                if (( attempt > 90 )); then
                  echo "kafka was still unreachable after 3 minutes" >&2
                  exit 1
                fi
                sleep 2
              done
          env:
            - name: KAFKA_HOST
              value: kafka
            - name: KAFKA_PORT
              value: "9092"
          resources:
            requests:
              memory: 32Mi
              cpu: 25m
            limits:
              memory: 64Mi
              cpu: 100m
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      containers:
        - name: alert-service
          image: stream/alert-service:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: alert-service-config
          env:
            # Credentials never appear in this spec, only a reference to them.
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: stream-postgres
                  key: POSTGRES_USER
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: stream-postgres
                  key: POSTGRES_PASSWORD
          resources:
            requests:
              memory: 640Mi
              cpu: 250m
            limits:
              # Larger than ingest: this one carries a JPA context, a connection
              # pool and a Kafka consumer with three listener threads.
              memory: 1Gi
              cpu: "1"
          lifecycle:
            preStop:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - sleep 10
          # Longer than ingest-service's budget because this pod does more before
          # it can answer: the same 30-45s cold JVM start, then Flyway acquires the
          # migration lock and applies V1__alerts.sql. On a first deploy against an
          # empty database that is a few seconds; on a contended lock (three
          # replicas starting at once, two of them waiting) it can be tens of
          # seconds. 10s initial + 40 x 5s = 210s is roughly 4x the observed worst
          # case, and no restart is attempted anywhere inside that window.
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 40
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
            successThreshold: 1
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
