apiVersion: v1
kind: ConfigMap
metadata:
  name: alert-service-config
  labels:
    app.kubernetes.io/name: alert-service
    app.kubernetes.io/component: api
data:
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  # The URL is not a secret and belongs with the rest of the wiring; only the
  # username and password come from the aware-postgres Secret.
  SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/aware

  MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: "true"
  MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,info,metrics,prometheus
  MANAGEMENT_ENDPOINT_HEALTH_SHOWDETAILS: always
  MANAGEMENT_METRICS_TAGS_APPLICATION: alert-service

  SERVER_SHUTDOWN: graceful
  SPRING_LIFECYCLE_TIMEOUTPERSHUTDOWNPHASE: 20s
