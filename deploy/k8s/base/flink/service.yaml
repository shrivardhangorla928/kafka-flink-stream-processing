apiVersion: v1
kind: Service
metadata:
  name: flink-jobmanager
  labels:
    app.kubernetes.io/name: flink
    app.kubernetes.io/component: jobmanager
    # Selector handle for a future Prometheus Operator ServiceMonitor.
    monitoring: aware
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "9249"
    prometheus.io/path: /metrics
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: flink
    app.kubernetes.io/component: jobmanager
  ports:
    - name: rpc
      port: 6123
      targetPort: rpc
      protocol: TCP
    - name: blob
      port: 6124
      targetPort: blob
      protocol: TCP
    - name: web
      port: 8081
      targetPort: web
      protocol: TCP
    - name: metrics
      port: 9249
      targetPort: metrics
      protocol: TCP

---
# TaskManagers need no Service for the RPC itself: they dial the JobManager's
# ClusterIP and the JobManager replies over that established connection, so nothing
# ever has to resolve a TaskManager by name. This headless Service exists purely so
# Prometheus can discover the three TaskManager pods individually - a load-balanced
# ClusterIP would scrape a random one of the three each interval.
apiVersion: v1
kind: Service
metadata:
  name: flink-taskmanager-metrics
  labels:
    app.kubernetes.io/name: flink
    app.kubernetes.io/component: taskmanager
    monitoring: aware
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "9249"
    prometheus.io/path: /metrics
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: flink
    app.kubernetes.io/component: taskmanager
  ports:
    - name: metrics
      port: 9249
      targetPort: metrics
      protocol: TCP
