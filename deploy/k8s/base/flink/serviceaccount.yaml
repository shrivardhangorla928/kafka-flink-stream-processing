# Application mode on a standalone cluster: the JobManager runs the job's main()
# itself and the TaskManagers are plain workers. Neither talks to the Kubernetes
# API - that is only needed by Flink's native Kubernetes integration, which this
# deployment deliberately does not use.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: flink-jobmanager
  labels:
    app.kubernetes.io/name: flink
    app.kubernetes.io/component: jobmanager
automountServiceAccountToken: false

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: flink-taskmanager
  labels:
    app.kubernetes.io/name: flink
    app.kubernetes.io/component: taskmanager
automountServiceAccountToken: false
