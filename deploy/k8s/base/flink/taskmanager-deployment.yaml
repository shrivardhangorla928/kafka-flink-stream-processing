apiVersion: apps/v1
kind: Deployment
metadata:
  name: flink-taskmanager
  labels:
    app.kubernetes.io/name: flink
    app.kubernetes.io/component: taskmanager
    app.kubernetes.io/version: 1.0.0
spec:
  # Three pods with one slot each, not one pod with three slots.
  #
  # Both fill a parallelism-3 job identically, but only this shape can be scaled by
  # Kubernetes: a HorizontalPodAutoscaler adjusts replica counts and cannot reach
  # inside a container to change taskmanager.numberOfTaskSlots. Phase 3 drives this
  # Deployment from a custom application metric, so the unit of capacity has to be
  # the pod. It also means one lost TaskManager costs one subtask rather than the
  # whole job's worth of slots.
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # Restarting a TaskManager fails the job and it restarts from the last
      # checkpoint, so a rolling update should replace them one at a time.
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: flink
      app.kubernetes.io/component: taskmanager
  template:
    metadata:
      labels:
        app.kubernetes.io/name: flink
        app.kubernetes.io/component: taskmanager
        app.kubernetes.io/version: 1.0.0
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9249"
        prometheus.io/path: /metrics
    spec:
      serviceAccountName: flink-taskmanager
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 9999
        runAsGroup: 9999
        fsGroup: 9999
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        # ScheduleAnyway, not DoNotSchedule: on a single-node minikube there is
        # only one topology domain and a hard constraint would leave two of the
        # three TaskManagers Pending forever.
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: flink
              app.kubernetes.io/component: taskmanager
      initContainers:
        # Same reasoning as the JobManager: the entrypoint rewrites config.yaml in
        # place, so conf/ must be a writable copy of the image's own directory.
        - name: flink-conf
          image: aware/flink-pipeline:1.0.0
          imagePullPolicy: IfNotPresent
          command:
            - /bin/bash
            - -c
            - |
              set -euo pipefail
              cp -a /opt/flink/conf/. /writable-conf/
              cp /config-source/config.yaml /writable-conf/config.yaml
          resources:
            requests:
              memory: 64Mi
              cpu: 50m
            limits:
              memory: 128Mi
              cpu: 200m
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: flink-conf
              mountPath: /writable-conf
            - name: config-source
              mountPath: /config-source
              readOnly: true
      containers:
        - name: taskmanager
          image: aware/flink-pipeline:1.0.0
          imagePullPolicy: IfNotPresent
          args:
            - taskmanager
          ports:
            - name: rpc
              containerPort: 6122
              protocol: TCP
            - name: data
              containerPort: 6121
              protocol: TCP
            - name: metrics
              containerPort: 9249
              protocol: TCP
          env:
            - name: JOB_MANAGER_RPC_ADDRESS
              value: flink-jobmanager
            # Read by the entrypoint; kept identical to config.yaml so the two can
            # never disagree about how many slots this pod offers.
            - name: TASK_MANAGER_NUMBER_OF_TASK_SLOTS
              value: "1"
          resources:
            requests:
              memory: 1280Mi
              cpu: 500m
            limits:
              # Must stay above taskmanager.memory.process.size (1600m).
              memory: 2Gi
              cpu: "1"
          startupProbe:
            tcpSocket:
              port: rpc
            periodSeconds: 5
            # 24 x 5s = 120s. A TaskManager JVM is up in about 15s; the margin is
            # for a cold image start on a loaded workstation.
            failureThreshold: 24
          readinessProbe:
            tcpSocket:
              port: rpc
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: rpc
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: flink-conf
              mountPath: /opt/flink/conf
            - name: flink-state
              mountPath: /flink-state
            - name: flink-log
              mountPath: /opt/flink/log
            # taskmanager.tmp.dirs defaults into /tmp; this is where spilled
            # network buffers and the blob cache land.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config-source
          configMap:
            name: flink-taskmanager-config
        - name: flink-conf
          emptyDir: {}
        - name: flink-log
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        - name: flink-state
          persistentVolumeClaim:
            claimName: flink-state
