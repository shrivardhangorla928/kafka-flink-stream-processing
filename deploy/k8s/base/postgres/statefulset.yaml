apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/component: database
    app.kubernetes.io/version: "16"
spec:
  serviceName: postgres
  # Deliberately one replica. Replicated PostgreSQL is a project in itself
  # (streaming replication, failover election, connection routing) and the
  # dissertation's subject is the streaming pipeline, not the alert store's
  # availability. See deploy/k8s/README.md, "Scope boundaries".
  replicas: 1
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
      app.kubernetes.io/component: database
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
        app.kubernetes.io/component: database
        app.kubernetes.io/version: "16"
    spec:
      serviceAccountName: postgres
      automountServiceAccountToken: false
      # Postgres treats SIGTERM as a smart shutdown: it waits for sessions to end.
      # 60s is enough for alert-service's pool to drain without a SIGKILL, which
      # would force crash recovery on the next start.
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        # uid/gid 70 is the `postgres` account inside postgres:16-alpine. The image
        # would normally start as root and drop to it; pinning it means the pod
        # never holds root at all. fsGroup makes the fresh PVC writable, which is
        # what initdb needs on first boot.
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgresql
              containerPort: 5432
              protocol: TCP
          envFrom:
            - secretRef:
                name: aware-postgres
          env:
            # A subdirectory rather than the mount root: initdb refuses to run in a
            # directory that already contains anything, and a PVC mount point can.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          resources:
            requests:
              memory: 512Mi
              cpu: 250m
            limits:
              memory: 1Gi
              cpu: "1"
          # pg_isready is the only check that distinguishes "port is open" from
          # "accepting queries"; during crash recovery the port is open and the
          # server rejects connections.
          startupProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - exec pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB" -h 127.0.0.1
            periodSeconds: 5
            # 30 x 5s = 150s, which covers first-boot initdb plus crash recovery.
            failureThreshold: 30
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - exec pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB" -h 127.0.0.1
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - exec pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB" -h 127.0.0.1
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 5
          securityContext:
            allowPrivilegeEscalation: false
            # Everything postgres writes outside PGDATA is a socket or a temp file,
            # and both are on emptyDir mounts below.
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: run
              mountPath: /var/run/postgresql
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/name: postgres
          app.kubernetes.io/component: database
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 5Gi
