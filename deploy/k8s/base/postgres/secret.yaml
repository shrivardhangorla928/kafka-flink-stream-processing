# The alert store's credentials. The database container reads them through
# envFrom; alert-service reads the same two keys through secretKeyRef. Neither
# workload carries the password in its own spec, so rotating it is a change to
# this object plus a restart, not an edit to a Deployment.
#
# Scope boundary: these are development credentials committed in clear so that
# `kubectl apply -k` is self-contained. A deployment that mattered would source
# them from Sealed Secrets, External Secrets or the cloud provider's secret
# store; the shape of every consumer here is already correct for that swap.
apiVersion: v1
kind: Secret
metadata:
  name: stream-postgres
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/component: database
type: Opaque
stringData:
  POSTGRES_DB: stream
  POSTGRES_USER: stream
  POSTGRES_PASSWORD: stream
