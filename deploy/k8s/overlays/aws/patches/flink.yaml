apiVersion: apps/v1
kind: Deployment
metadata:
  name: flink-jobmanager
spec:
  template:
    spec:
      containers:
        - name: jobmanager
          env:
            # the job reads this itself, so parallelism.default in config.yaml is not enough
            - name: PARALLELISM
              value: "1"
          resources:
            requests:
              memory: 512Mi
              cpu: 100m
            limits:
              memory: 1Gi
              cpu: "1"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flink-taskmanager
spec:
  template:
    spec:
      containers:
        - name: taskmanager
          resources:
            requests:
              memory: 640Mi
              cpu: 100m
            limits:
              memory: 1280Mi
              cpu: "1"
