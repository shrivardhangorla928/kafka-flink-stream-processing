apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingest-service
spec:
  template:
    spec:
      containers:
        - name: ingest-service
          resources:
            requests:
              memory: 256Mi
              cpu: 100m
            limits:
              memory: 448Mi
              cpu: 500m
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alert-service
spec:
  template:
    spec:
      containers:
        - name: alert-service
          resources:
            requests:
              memory: 320Mi
              cpu: 100m
            limits:
              memory: 512Mi
              cpu: 500m
