apiVersion: v1
kind: ConfigMap
metadata:
  name: kafka-config
data:
  KAFKA_HEAP_OPTS: "-Xmx256m -Xms256m"
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
spec:
  template:
    spec:
      containers:
        - name: kafka
          resources:
            requests:
              memory: 384Mi
              cpu: 100m
            limits:
              memory: 640Mi
              cpu: "1"
