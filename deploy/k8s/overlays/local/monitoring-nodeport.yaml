# Fixed NodePorts for the two UIs, same idea as the Flink UI.
apiVersion: v1
kind: Service
metadata:
  name: grafana-ui
  labels:
    app.kubernetes.io/name: grafana
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: grafana
  ports:
    - name: http
      port: 3000
      targetPort: http
      nodePort: 30300
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus-ui
  labels:
    app.kubernetes.io/name: prometheus
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: prometheus
  ports:
    - name: http
      port: 9090
      targetPort: http
      nodePort: 30090
