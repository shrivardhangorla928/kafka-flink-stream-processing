# Fixed NodePorts so the URLs in the README stay valid across cluster rebuilds.
# The numbers echo the Compose host ports (8091/8092) to keep one mental model.
apiVersion: v1
kind: Service
metadata:
  name: ingest-service
spec:
  type: NodePort
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
      nodePort: 30091

---
apiVersion: v1
kind: Service
metadata:
  name: alert-service
spec:
  type: NodePort
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
      nodePort: 30092
