apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
spec:
  template:
    spec:
      containers:
        - name: kafka
          # Always: a staging cluster pulls from a registry, and a tag that was
          # rebuilt must not be served from a stale node cache.
          imagePullPolicy: Always
          env:
            # Heap is 2560m inside a 4Gi limit. The remaining 1.5Gi is not waste:
            # Kafka serves reads from the page cache and allocates direct buffers
            # per network thread, and both live outside the heap.
            - name: KAFKA_HEAP_OPTS
              value: -Xmx2560m -Xms2560m
          resources:
            requests:
              memory: 2Gi
              cpu: "1"
            limits:
              memory: 4Gi
              cpu: "2"
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 20Gi
