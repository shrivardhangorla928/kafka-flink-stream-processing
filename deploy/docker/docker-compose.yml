# Local single-node stand-up of the whole pipeline.
#
#   docker compose -f deploy/docker/docker-compose.yml up -d --build
#
# Host ports are deliberately shifted off the defaults because this workstation already
# runs a PostgreSQL on 5432 and a Jenkins on 8099:
#   Kafka  -> 29092      Postgres -> 5433     Flink UI -> 8081
#   Ingest -> 8091       Alerts   -> 8092
#
# Memory limits are set on every service. They add up to roughly 6.8 GiB, which leaves
# headroom on a 16 GiB workstation that is also running an IDE and the Jenkins container.

name: stream-processing

x-restart: &restart
  restart: unless-stopped

services:

  # ---------------------------------------------------------------------------
  # Kafka, single node in KRaft mode (no ZooKeeper).
  # ---------------------------------------------------------------------------
  kafka:
    image: apache/kafka:3.9.1
    container_name: stream-kafka
    <<: *restart
    ports:
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://:29092
      # In-cluster clients resolve `kafka:9092`; tools on the host use `localhost:29092`.
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # Without this the image keeps its default of /tmp/kraft-combined-logs and the kafka-data
      # volume below is silently inert - the log segments vanish on every container recreate.
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      # Single broker, so every internal topic has to drop to one replica.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_NUM_PARTITIONS: 3
      # No rebalance delay: consumers join instantly on a local restart.
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_RETENTION_HOURS: 24
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_HEAP_OPTS: "-Xmx768m -Xms768m"
      CLUSTER_ID: stream-processing-01
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s
    mem_limit: 1200m

  # ---------------------------------------------------------------------------
  # One-shot topic provisioning.
  #
  # The services would auto-create their topics, but auto-creation uses the broker
  # default partition count and gives no control over retention. Creating them
  # explicitly pins 3 partitions, which is what the Flink job's parallelism of 3 and
  # the alert service's listener concurrency of 3 are both sized against.
  # ---------------------------------------------------------------------------
  kafka-init:
    image: apache/kafka:3.9.1
    container_name: stream-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -euo pipefail
        BS=kafka:9092
        create() {
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server "$$BS" --create --if-not-exists \
            --topic "$$1" --partitions 3 --replication-factor 1 --config retention.ms="$$2"
        }
        create telemetry.raw.v1        86400000
        create telemetry.aggregated.v1 86400000
        create alerts.generated.v1     604800000
        create telemetry.dlq.v1        604800000
        echo "--- topics ---"
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server "$$BS" --describe
    mem_limit: 512m

  # ---------------------------------------------------------------------------
  # PostgreSQL - the alert store.
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: stream-postgres
    <<: *restart
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: stream
      POSTGRES_USER: stream
      POSTGRES_PASSWORD: stream
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stream -d stream"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    mem_limit: 512m

  # ---------------------------------------------------------------------------
  # Flink session cluster.
  #
  # A session cluster rather than application mode: it exposes the web UI at 8081 for
  # inspecting the running job graph, watermarks, backpressure and checkpoints, which is
  # what the evaluation chapter needs evidence from. The Kubernetes deployment switches
  # to application mode, where one job owns one cluster.
  # ---------------------------------------------------------------------------
  jobmanager:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      target: flinkjob
    image: stream/flink-pipeline:1.0.0
    container_name: stream-flink-jobmanager
    <<: *restart
    ports:
      - "8081:8081"
    command: jobmanager
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: jobmanager
        jobmanager.memory.process.size: 1024m
        parallelism.default: 3
        state.backend.type: hashmap
        execution.checkpointing.interval: 30s
        execution.checkpointing.mode: EXACTLY_ONCE
        state.checkpoints.dir: file:///flink-state/checkpoints
        state.savepoints.dir: file:///flink-state/savepoints
        web.submit.enable: true
    volumes:
      - flink-state:/flink-state
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8081/overview >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    mem_limit: 1300m

  taskmanager:
    image: stream/flink-pipeline:1.0.0
    container_name: stream-flink-taskmanager
    <<: *restart
    depends_on:
      jobmanager:
        condition: service_healthy
    command: taskmanager
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: jobmanager
        taskmanager.memory.process.size: 2048m
        # One slot per Kafka partition, so a parallelism-3 job fits in a single TaskManager.
        taskmanager.numberOfTaskSlots: 3
        state.backend.type: hashmap
        state.checkpoints.dir: file:///flink-state/checkpoints
        state.savepoints.dir: file:///flink-state/savepoints
    volumes:
      - flink-state:/flink-state
    mem_limit: 2400m

  # ---------------------------------------------------------------------------
  # One-shot job submission into the session cluster.
  # ---------------------------------------------------------------------------
  flink-job-submitter:
    image: stream/flink-pipeline:1.0.0
    container_name: stream-flink-submitter
    depends_on:
      jobmanager:
        condition: service_healthy
      taskmanager:
        condition: service_started
      kafka-init:
        condition: service_completed_successfully
    restart: "no"
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -euo pipefail
        # The TaskManager registers with the JobManager a few seconds after the JobManager
        # reports healthy; submitting before that fails with "not enough slots".
        for i in $$(seq 1 30); do
          slots=$$(curl -fsS http://jobmanager:8081/overview | grep -o '"slots-available":[0-9]*' | cut -d: -f2 || echo 0)
          if [ "$${slots:-0}" -ge 3 ]; then break; fi
          echo "waiting for task slots (have $${slots:-0}/3) ..."; sleep 5
        done
        exec /opt/flink/bin/flink run \
          --jobmanager jobmanager:8081 \
          --detached \
          --class com.stream.processing.flink.TelemetryPipelineJob \
          /opt/flink/usrlib/flink-pipeline.jar \
          --kafka.bootstrap.servers kafka:9092 \
          --source.start.offset latest
    mem_limit: 640m

  # ---------------------------------------------------------------------------
  # Application services.
  # ---------------------------------------------------------------------------
  ingest-service:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      target: ingest
    image: stream/ingest-service:1.0.0
    container_name: stream-ingest-service
    <<: *restart
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    ports:
      - "8091:8080"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_PROFILES_ACTIVE: docker
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health/readiness >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s
    mem_limit: 640m

  alert-service:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      target: alert
    image: stream/alert-service:1.0.0
    container_name: stream-alert-service
    <<: *restart
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    ports:
      - "8092:8080"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/stream
      SPRING_DATASOURCE_USERNAME: stream
      SPRING_DATASOURCE_PASSWORD: stream
      SPRING_PROFILES_ACTIVE: docker
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health/readiness >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    mem_limit: 768m

volumes:
  kafka-data:
  postgres-data:
  flink-state:
